<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="1.7s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.7s"><mpath href="#ea" xlink:href="#ea"/></animateMotion></circle>
