<text x="106" y="115" fill="#f97316" font-size="9.5" font-weight="600" letter-spacing=".6" text-anchor="middle">DISEÑÉ Y CONSTRUÍ</text>
<text x="44" y="144" fill="#f5f5f5" font-size="16" font-weight="600">TuMatch / Orkezto</text>
<text x="44" y="165" fill="#c9c9d3" font-size="11.5">CRM inmobiliario multi-marca</text>
<text x="44" y="182" fill="#a1a1aa" font-size="11">leads · propiedades · cobranzas</text>
<circle cx="48" cy="195" r="3" fill="#22c55e"/>
<text x="57" y="199" fill="#a1a1aa" font-size="10.5">en producción · 6 APIs externas</text>
