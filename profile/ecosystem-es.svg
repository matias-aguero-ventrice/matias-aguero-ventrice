</g>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="1.9s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.9s"><mpath href="#eb" xlink:href="#eb"/></animateMotion></circle>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="3.0s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="3.0s"><mpath href="#eb" xlink:href="#eb"/></animateMotion></circle>
<g class="n" style="animation-delay:1.1s">
<path class="p" id="lc" d="M670,149 C635,149 635,225 600,225" fill="none" stroke="#71717a" stroke-width="1.6" stroke-dasharray="4 4"/>
</g>
<circle r="2.6" fill="#a1a1aa" opacity="0"><set attributeName="opacity" to=".9" begin="2.0s"/><animateMotion dur="2.6s" repeatCount="indefinite" begin="2.0s"><mpath href="#lc" xlink:href="#lc"/></animateMotion></circle>
<g class="n" style="animation-delay:1.2s">
<path class="p" id="le" d="M670,329 C635,329 635,253 600,253" fill="none" stroke="#71717a" stroke-width="1.6" stroke-dasharray="4 4"/>
</g>
<circle r="2.6" fill="#a1a1aa" opacity="0"><set attributeName="opacity" to=".9" begin="2.1s"/><animateMotion dur="2.6s" repeatCount="indefinite" begin="2.1s"><mpath href="#le" xlink:href="#le"/></animateMotion></circle>
<g class="n" style="animation-delay:1.3s">
<path class="p" d="M770,208 V270" fill="none" stroke="#71717a" stroke-width="1.6" stroke-dasharray="4 4"/>
