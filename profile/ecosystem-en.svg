<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="548" viewBox="0 0 900 548" role="img" aria-label="Grupo Propital ecosystem diagram: TuMatch/Orkezto and Propirent send data to Numinap; Orvyt integrates with Numinap and Propital. Separately, MiSUPER, a personal project">
<style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif;}
.n{opacity:0;animation:up .6s cubic-bezier(.2,.8,.3,1) forwards;}
.e{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease-out forwards;}
.p{animation:pulse 2.4s ease-in-out 2s infinite;}
@keyframes up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes pulse{50%{stroke-opacity:.35;}}
@media (prefers-reduced-motion:reduce){.n,.e,.p{animation:none;opacity:1;stroke-dashoffset:0;}}
</style>
<defs>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f97316" flood-opacity=".35"/></filter>
</defs>
<rect width="900" height="548" rx="4.5" fill="#0a0a0a"/>
<text x="30" y="38" fill="#f97316" font-size="18" font-weight="600">Grupo Propital ecosystem</text>
<text x="30" y="60" fill="#a1a1aa" font-size="12">How the products I build and lead connect</text>
<g fill="#a1a1aa" font-size="10.5">
<path d="M650,34 h22" stroke="#f97316" stroke-width="1.6"/>
<text x="678" y="38">data flow</text>
<path d="M770,34 h22" stroke="#71717a" stroke-width="1.6" stroke-dasharray="4 4"/>
<text x="798" y="38">integration</text>
</g>
<g class="n" style="animation-delay:0.1s">
<rect x="30" y="90" width="230" height="118" rx="8" fill="#111113" stroke="#27272a"/>
<rect x="44" y="102" width="118" height="18" rx="9" fill="none" stroke="#f97316" stroke-opacity=".55"/>
<text x="103" y="115" fill="#f97316" font-size="9.5" font-weight="600" letter-spacing=".6" text-anchor="middle">DESIGNED &amp; BUILT</text>
<text x="44" y="144" fill="#f5f5f5" font-size="16" font-weight="600">TuMatch / Orkezto</text>
<text x="44" y="165" fill="#c9c9d3" font-size="11.5">Multi-brand real-estate CRM</text>
<text x="44" y="182" fill="#a1a1aa" font-size="11">leads · properties · billing</text>
<circle cx="48" cy="195" r="3" fill="#22c55e"/>
<text x="57" y="199" fill="#a1a1aa" font-size="10.5">in production · 6 external APIs</text>
</g>
<g class="n" style="animation-delay:0.2s">
<rect x="30" y="270" width="230" height="118" rx="8" fill="#111113" stroke="#27272a"/>
<rect x="44" y="282" width="86" height="18" rx="9" fill="none" stroke="#f97316" stroke-opacity=".55"/>
<text x="87" y="295" fill="#f97316" font-size="9.5" font-weight="600" letter-spacing=".6" text-anchor="middle">CONTRIBUTOR</text>
<text x="44" y="324" fill="#f5f5f5" font-size="16" font-weight="600">Propirent</text>
<text x="44" y="345" fill="#c9c9d3" font-size="11.5">Property management</text>
<text x="44" y="362" fill="#a1a1aa" font-size="11">own integration into Numinap</text>
</g>
<g class="n" style="animation-delay:0.3s">
<rect x="380" y="180" width="220" height="118" rx="8" fill="#111113" stroke="#f97316" filter="url(#glow)"/>
<rect x="394" y="192" width="42" height="18" rx="9" fill="none" stroke="#f97316" stroke-opacity=".55"/>
<text x="415" y="205" fill="#f97316" font-size="9.5" font-weight="600" letter-spacing=".6" text-anchor="middle">LEAD</text>
<text x="394" y="234" fill="#f5f5f5" font-size="16" font-weight="600">Numinap</text>
<text x="394" y="255" fill="#c9c9d3" font-size="11.5">Wealth planning</text>
<text x="394" y="272" fill="#a1a1aa" font-size="11">investor net worth</text>
<circle cx="398" cy="285" r="3" fill="#22c55e"/>
<text x="407" y="289" fill="#a1a1aa" font-size="10.5">integrations in production</text>
</g>
<g class="n" style="animation-delay:0.4s">
<rect x="670" y="90" width="200" height="118" rx="8" fill="#111113" stroke="#27272a"/>
<rect x="684" y="102" width="86" height="18" rx="9" fill="none" stroke="#f97316" stroke-opacity=".55"/>
<text x="727" y="115" fill="#f97316" font-size="9.5" font-weight="600" letter-spacing=".6" text-anchor="middle">CONTRIBUTOR</text>
<text x="684" y="144" fill="#f5f5f5" font-size="16" font-weight="600">Orvyt</text>
<text x="684" y="165" fill="#c9c9d3" font-size="11.5">Multi-tenant platform</text>
<text x="684" y="182" fill="#a1a1aa" font-size="11">payments · messaging · after-sales</text>
<circle cx="688" cy="195" r="3" fill="#22c55e"/>
<text x="697" y="199" fill="#a1a1aa" font-size="10.5">in production</text>
</g>
<g class="n" style="animation-delay:0.5s">
<rect x="670" y="270" width="200" height="118" rx="8" fill="#111113" stroke="#27272a"/>
<rect x="684" y="282" width="150" height="18" rx="9" fill="none" stroke="#f97316" stroke-opacity=".55"/>
<text x="759" y="295" fill="#f97316" font-size="9.5" font-weight="600" letter-spacing=".6" text-anchor="middle">HEAD OF PRODUCT &amp; OPS</text>
<text x="684" y="324" fill="#f5f5f5" font-size="16" font-weight="600">Propital</text>
<text x="684" y="345" fill="#c9c9d3" font-size="11.5">Proptech group · Chile</text>
<text x="684" y="362" fill="#a1a1aa" font-size="11">group-wide product &amp; operations</text>
</g>
<path id="ea" class="e" style="animation-delay:0.8s" d="M260,149 C320,149 320,225 380,225" pathLength="1" fill="none" stroke="#f97316" stroke-opacity=".7" stroke-width="1.6"/>
<g class="n" style="animation-delay:1.1s">
<text x="320" y="122" fill="#c9c9d3" font-size="11" font-weight="600" text-anchor="middle">referral link</text>
<text x="320" y="136" fill="#a1a1aa" font-size="10" text-anchor="middle">broker → client</text>
</g>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="1.7s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.7s"><mpath href="#ea" xlink:href="#ea"/></animateMotion></circle>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="2.8s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="2.8s"><mpath href="#ea" xlink:href="#ea"/></animateMotion></circle>
<path id="eb" class="e" style="animation-delay:1.0s" d="M260,329 C320,329 320,253 380,253" pathLength="1" fill="none" stroke="#f97316" stroke-opacity=".7" stroke-width="1.6"/>
<g class="n" style="animation-delay:1.3s">
<text x="320" y="356" fill="#c9c9d3" font-size="11" font-weight="600" text-anchor="middle">cash flow</text>
<text x="320" y="370" fill="#a1a1aa" font-size="10" text-anchor="middle">property → net worth</text>
</g>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="1.9s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.9s"><mpath href="#eb" xlink:href="#eb"/></animateMotion></circle>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="3.0s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="3.0s"><mpath href="#eb" xlink:href="#eb"/></animateMotion></circle>
<g class="n" style="animation-delay:1.1s">
<path class="p" d="M670,149 C635,149 635,225 600,225" fill="none" stroke="#71717a" stroke-width="1.6" stroke-dasharray="4 4"/>
</g>
<g class="n" style="animation-delay:1.2s">
<path class="p" d="M770,208 V270" fill="none" stroke="#71717a" stroke-width="1.6" stroke-dasharray="4 4"/>
</g>
<g class="n" style="animation-delay:1.4s">
<path d="M30,422 H870" stroke="#27272a" stroke-dasharray="2 5"/>
<rect x="30" y="444" width="840" height="80" rx="8" fill="#111113" stroke="#27272a"/>
<rect x="44" y="458" width="118" height="18" rx="9" fill="none" stroke="#f97316" stroke-opacity=".55"/>
<text x="103" y="471" fill="#f97316" font-size="9.5" font-weight="600" letter-spacing=".6" text-anchor="middle">PERSONAL PROJECT</text>
<text x="44" y="504" fill="#f5f5f5" font-size="16" font-weight="600">MiSUPER</text>
<text x="230" y="480" fill="#c9c9d3" font-size="11.5">Management system for kiosks and small retailers: sales, stock and inventory</text>
<circle cx="234" cy="498" r="3" fill="#22c55e"/>
<text x="243" y="502" fill="#a1a1aa" font-size="10.5">live demo · Next.js · TypeScript · Supabase</text>
</g>
</svg>
