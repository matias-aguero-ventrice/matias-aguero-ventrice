<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="392" viewBox="0 0 900 392" role="img" aria-label="Product ecosystem diagram: TuMatch/Orkezto and Propirent integrate into Numinap; Orvyt integrates payments, messaging and after-sales">
<style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif;}
.n{opacity:0;animation:up .6s cubic-bezier(.2,.8,.3,1) forwards;}
.e{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease-out forwards;}
@keyframes up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes draw{to{stroke-dashoffset:0;}}
@media (prefers-reduced-motion:reduce){.n,.e{animation:none;opacity:1;stroke-dashoffset:0;}}
</style>
<defs>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f97316" flood-opacity=".35"/></filter>
</defs>
<rect width="900" height="392" rx="4.5" fill="#0a0a0a"/>
<text x="30" y="38" fill="#f97316" font-size="18" font-weight="600">Product ecosystem</text>
<text x="30" y="60" fill="#a1a1aa" font-size="12">How the products I build and lead connect</text>
<g class="n" style="animation-delay:0.1s">
<rect x="30" y="90" width="230" height="118" rx="8" fill="#111113" stroke="#27272a"/>
<rect x="44" y="102" width="118" height="18" rx="9" fill="none" stroke="#f97316" stroke-opacity=".55"/>
<text x="103" y="115" fill="#f97316" font-size="9.5" font-weight="600" letter-spacing=".6" text-anchor="middle">DESIGNED &amp; BUILT</text>
<text x="44" y="144" fill="#f5f5f5" font-size="16" font-weight="600">TuMatch / Orkezto</text>
<text x="44" y="165" fill="#c9c9d3" font-size="11.5">Multi-brand real-estate CRM</text>
<text x="44" y="182" fill="#a1a1aa" font-size="11">leads · properties · billing</text>
<circle cx="48" cy="195" r="3" fill="#22c55e"/>
<text x="57" y="199" fill="#a1a1aa" font-size="10.5">in production · 6 external APIs</text>
</g>
<g class="n" style="animation-delay:0.25s">
<rect x="30" y="250" width="230" height="118" rx="8" fill="#111113" stroke="#27272a"/>
<rect x="44" y="262" width="86" height="18" rx="9" fill="none" stroke="#f97316" stroke-opacity=".55"/>
<text x="87" y="275" fill="#f97316" font-size="9.5" font-weight="600" letter-spacing=".6" text-anchor="middle">CONTRIBUTOR</text>
<text x="44" y="304" fill="#f5f5f5" font-size="16" font-weight="600">Propirent</text>
<text x="44" y="325" fill="#c9c9d3" font-size="11.5">Property management</text>
<text x="44" y="342" fill="#a1a1aa" font-size="11">own integration into Numinap</text>
</g>
<g class="n" style="animation-delay:0.4s">
<rect x="400" y="170" width="240" height="118" rx="8" fill="#111113" stroke="#f97316" filter="url(#glow)"/>
<rect x="414" y="182" width="42" height="18" rx="9" fill="none" stroke="#f97316" stroke-opacity=".55"/>
<text x="435" y="195" fill="#f97316" font-size="9.5" font-weight="600" letter-spacing=".6" text-anchor="middle">LEAD</text>
<text x="414" y="224" fill="#f5f5f5" font-size="16" font-weight="600">Numinap</text>
<text x="414" y="245" fill="#c9c9d3" font-size="11.5">Wealth planning</text>
<text x="414" y="262" fill="#a1a1aa" font-size="11">investor net worth</text>
<circle cx="418" cy="275" r="3" fill="#22c55e"/>
<text x="427" y="279" fill="#a1a1aa" font-size="10.5">integrations in production</text>
</g>
<g class="n" style="animation-delay:0.55s">
<rect x="690" y="90" width="180" height="118" rx="8" fill="#111113" stroke="#27272a"/>
<rect x="704" y="102" width="86" height="18" rx="9" fill="none" stroke="#f97316" stroke-opacity=".55"/>
<text x="747" y="115" fill="#f97316" font-size="9.5" font-weight="600" letter-spacing=".6" text-anchor="middle">CONTRIBUTOR</text>
<text x="704" y="144" fill="#f5f5f5" font-size="16" font-weight="600">Orvyt</text>
<text x="704" y="165" fill="#c9c9d3" font-size="11.5">Real-estate platform</text>
<text x="704" y="182" fill="#a1a1aa" font-size="11">multi-tenant · LatAm</text>
<circle cx="708" cy="195" r="3" fill="#22c55e"/>
<text x="717" y="199" fill="#a1a1aa" font-size="10.5">in production</text>
</g>
<path id="ea" class="e" style="animation-delay:0.8s" d="M260,149 C330,149 330,215 400,215" pathLength="1" fill="none" stroke="#f97316" stroke-opacity=".7" stroke-width="1.6"/>
<g class="n" style="animation-delay:1.1s">
<text x="330" y="133" fill="#c9c9d3" font-size="11" font-weight="600" text-anchor="middle">referral link</text>
<text x="330" y="147" fill="#a1a1aa" font-size="10" text-anchor="middle">broker → client</text>
</g>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="1.7s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.7s"><mpath href="#ea" xlink:href="#ea"/></animateMotion></circle>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="2.8s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="2.8s"><mpath href="#ea" xlink:href="#ea"/></animateMotion></circle>
<path id="eb" class="e" style="animation-delay:1.0s" d="M260,309 C330,309 330,243 400,243" pathLength="1" fill="none" stroke="#f97316" stroke-opacity=".7" stroke-width="1.6"/>
<g class="n" style="animation-delay:1.3s">
<text x="330" y="334" fill="#c9c9d3" font-size="11" font-weight="600" text-anchor="middle">cash flow</text>
<text x="330" y="348" fill="#a1a1aa" font-size="10" text-anchor="middle">property → net worth</text>
</g>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="1.9s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.9s"><mpath href="#eb" xlink:href="#eb"/></animateMotion></circle>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="3.0s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="3.0s"><mpath href="#eb" xlink:href="#eb"/></animateMotion></circle>
<path class="e" style="animation-delay:1.1s" d="M708,208 V329.0" pathLength="1" fill="none" stroke="#27272a" stroke-width="1.4"/>
<g class="n" style="animation-delay:1.30s">
<path d="M708,249.0 H722" stroke="#27272a" stroke-width="1.4"/>
<rect x="722" y="236" width="148" height="26" rx="13" fill="#111113" stroke="#27272a"/>
<text x="796.0" y="253" fill="#c9c9d3" font-size="10.5" text-anchor="middle">MercadoPago · Stripe</text>
</g>
<g class="n" style="animation-delay:1.45s">
<path d="M708,289.0 H722" stroke="#27272a" stroke-width="1.4"/>
<rect x="722" y="276" width="148" height="26" rx="13" fill="#111113" stroke="#27272a"/>
<text x="796.0" y="293" fill="#c9c9d3" font-size="10.5" text-anchor="middle">Twilio · WhatsApp/SMS</text>
</g>
<g class="n" style="animation-delay:1.60s">
<path d="M708,329.0 H722" stroke="#27272a" stroke-width="1.4"/>
<rect x="722" y="316" width="148" height="26" rx="13" fill="#111113" stroke="#27272a"/>
<text x="796.0" y="333" fill="#c9c9d3" font-size="10.5" text-anchor="middle">After-sales module</text>
</g>
</svg>
