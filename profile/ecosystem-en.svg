<text x="305" y="370" fill="#a1a1aa" font-size="10" text-anchor="middle">broker → client</text>
</g>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="1.9s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.9s"><mpath href="#ea" xlink:href="#ea"/></animateMotion></circle>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="3.0s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="3.0s"><mpath href="#ea" xlink:href="#ea"/></animateMotion></circle>
<path id="ee" class="e" style="animation-delay:1.2s" d="M670,329 C615,329 615,253 560,253" pathLength="1" fill="none" stroke="#f97316" stroke-opacity=".7" stroke-width="1.6"/>
<g class="n" style="animation-delay:1.5s">
<text x="615" y="356" fill="#c9c9d3" font-size="11" font-weight="600" text-anchor="middle">investment stage</text>
<text x="615" y="370" fill="#a1a1aa" font-size="10" text-anchor="middle">client operations</text>
</g>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="2.1s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="2.1s"><mpath href="#ee" xlink:href="#ee"/></animateMotion></circle>
<circle r="3.2" fill="#f97316" opacity="0"><set attributeName="opacity" to="1" begin="3.2s"/><animateMotion dur="2.2s" repeatCount="indefinite" begin="3.2s"><mpath href="#ee" xlink:href="#ee"/></animateMotion></circle>
<g class="n" style="animation-delay:1.1s">
<path class="p" id="lc" d="M670,149 C615,149 615,225 560,225" fill="none" stroke="#71717a" stroke-width="1.6" stroke-dasharray="4 4"/>
</g>
<circle r="2.6" fill="#a1a1aa" opacity="0"><set attributeName="opacity" to=".9" begin="2.0s"/><animateMotion dur="2.6s" repeatCount="indefinite" begin="2.0s"><mpath href="#lc" xlink:href="#lc"/></animateMotion></circle>
<g class="n" style="animation-delay:1.4s">
<path class="p" d="M780,208 V270" fill="none" stroke="#f97316" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="6 5"/>
</g>
<g class="n" style="animation-delay:1.6s">
<text x="770" y="236" fill="#c9c9d3" font-size="11" font-weight="600" text-anchor="end">agency catalogs</text>
<text x="770" y="250" fill="#a1a1aa" font-size="10" text-anchor="end">in progress</text>
</g>
