<g class="node" style="animation-delay:0.82s">
<circle cx="972" cy="236" r="4.5" fill="#18181b" stroke="#f97316" stroke-width="1.5"/>
</g>
<text class="mono in" style="animation-delay:1.02s" x="960" y="240" fill="#a1a1aa" text-anchor="end">propirent</text>
<g class="node" style="animation-delay:0.94s">
<circle cx="1184" cy="88" r="4.5" fill="#18181b" stroke="#f97316" stroke-width="1.5"/>
</g>
<text class="mono in" style="animation-delay:1.14s" x="1196" y="92" fill="#a1a1aa" text-anchor="start">orvyt</text>
<g class="node" style="animation-delay:1.06s">
<circle cx="1188" cy="232" r="4.5" fill="#18181b" stroke="#f97316" stroke-width="1.5"/>
</g>
