<path id="e-propirent" class="edge" style="animation-delay:1.05s" d="M972,236 L1090,160" pathLength="1" fill="none" stroke="#f97316" stroke-opacity=".45" stroke-width="1.3"/>
<path d="M1184,88 L1090,160" fill="none" stroke="#71717a" stroke-opacity=".5" stroke-width="1.3" stroke-dasharray="3 4"/>
<path id="e-propital" class="edge" style="animation-delay:1.35s" d="M1188,232 L1090,160" pathLength="1" fill="none" stroke="#f97316" stroke-opacity=".45" stroke-width="1.3"/>
<path d="M1184,88 L1188,232" fill="none" stroke="#f97316" stroke-opacity=".35" stroke-width="1.3" stroke-dasharray="5 5"/>
<circle r="2.6" fill="#fdba74" opacity="0"><set attributeName="opacity" to="1" begin="1.8s"/><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#e-tumatch" xlink:href="#e-tumatch"/></animateMotion></circle>
<circle r="2.6" fill="#fdba74" opacity="0"><set attributeName="opacity" to="1" begin="2.5s"/><animateMotion dur="2.4s" begin="2.5s" repeatCount="indefinite"><mpath href="#e-propirent" xlink:href="#e-propirent"/></animateMotion></circle>
<circle r="2.6" fill="#fdba74" opacity="0"><set attributeName="opacity" to="1" begin="3.2s"/><animateMotion dur="2.4s" begin="3.2s" repeatCount="indefinite"><mpath href="#e-propital" xlink:href="#e-propital"/></animateMotion></circle>
<g class="node" style="animation-delay:0.70s">
<circle cx="962" cy="92" r="4.5" fill="#18181b" stroke="#f97316" stroke-width="1.5"/>
</g>
