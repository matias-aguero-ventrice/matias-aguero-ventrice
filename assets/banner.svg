<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Matías Agüero Ventrice — Head of Product &amp; Operations · Grupo Propital">
<style>
text{font-family:Inter, 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif;}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;white-space:pre;}
.in{opacity:0;animation:up .8s cubic-bezier(.2,.8,.3,1) forwards;}
.drift1{animation:drift 14s ease-in-out infinite alternate;}
.drift2{animation:drift 18s ease-in-out -6s infinite alternate-reverse;}
.cursor{opacity:0;animation:blink 1s steps(1) 2.70s infinite;}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes drift{to{transform:translate(60px,20px);}}
@keyframes blink{0%{opacity:1;}50%{opacity:0;}}
@media (prefers-reduced-motion:reduce){.in,.cursor{animation:none;opacity:1;}.drift1,.drift2{animation:none;}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09090b"/><stop offset="1" stop-color="#151518"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
<radialGradient id="fade" cx=".45" cy=".45" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="gridmask"><rect width="1280" height="320" fill="url(#fade)"/></mask>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#f97316" stop-opacity=".15"/></linearGradient>
<linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="80" y1="90" x2="220" y2="230"><stop offset="0" stop-color="#f97316"/><stop offset=".5" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316" stop-opacity=".15"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 150 160" to="360 150 160" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/></linearGradient>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-520" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fafafa"/><stop offset=".4" stop-color="#f97316"/><stop offset=".6" stop-color="#fdba74"/><stop offset="1" stop-color="#fafafa"/><animateTransform attributeName="gradientTransform" type="translate" from="160 0" to="1300 0" begin="1s" dur="5s" repeatCount="indefinite"/></linearGradient>
<clipPath id="type"><rect x="258" y="140" width="0" height="36"><animate attributeName="width" from="0" to="520" begin=".6s" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .2 1"/></rect></clipPath>
<clipPath id="card"><rect width="1280" height="320" rx="16"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="320" fill="url(#bg)"/>
<g class="drift1"><ellipse cx="200" cy="80" rx="240" ry="150" fill="#f97316" fill-opacity=".20" filter="url(#blur)"/></g>
<g class="drift2"><ellipse cx="1060" cy="250" rx="260" ry="130" fill="#f97316" fill-opacity=".10" filter="url(#blur)"/></g>
<rect width="1280" height="320" fill="url(#grid)" mask="url(#gridmask)"/>
<rect width="5" height="320" fill="url(#bar)"/>
<rect x=".5" y=".5" width="1279" height="319" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
</g>
<g class="in" style="animation-delay:.5s">
<rect x="930" y="60" width="310" height="200" rx="10" fill="#0e0e10" fill-opacity=".92" stroke="#2e2e33"/>
<path d="M930,88 H1240" stroke="#2e2e33"/>
<circle cx="946" cy="74" r="4.5" fill="#ff5f57" fill-opacity=".85"/>
<circle cx="960" cy="74" r="4.5" fill="#febc2e" fill-opacity=".85"/>
<circle cx="974" cy="74" r="4.5" fill="#28c840" fill-opacity=".85"/>
<text class="mono" x="1085.0" y="78" fill="#71717a" font-size="11" text-anchor="middle">~/matias</text>
</g>
<text class="mono in" style="animation-delay:0.90s" x="946" y="110" font-size="12"><tspan fill="#f97316">$</tspan> <tspan fill="#d4d4d8">whoami</tspan></text>
<text class="mono in" style="animation-delay:1.20s" x="946" y="132" font-size="12"><tspan fill="#e4e4e7">matías — product &amp; ops builder</tspan></text>
<text class="mono in" style="animation-delay:1.50s" x="946" y="154" font-size="12"><tspan fill="#f97316">$</tspan> <tspan fill="#d4d4d8">ls proyectos/</tspan></text>
<text class="mono in" style="animation-delay:1.80s" x="946" y="176" font-size="12"><tspan fill="#fdba74">misuper/  made-in-3d/  portfolio/</tspan></text>
<text class="mono in" style="animation-delay:2.10s" x="946" y="198" font-size="12"><tspan fill="#f97316">$</tspan> <tspan fill="#d4d4d8">cat foco.txt</tspan></text>
<text class="mono in" style="animation-delay:2.40s" x="946" y="220" font-size="12"><tspan fill="#e4e4e7">producto · operaciones · IA aplicada</tspan></text>
<text class="mono in" style="animation-delay:2.70s" x="946" y="242" font-size="12" fill="#f97316">$</text>
<rect class="cursor" x="960" y="231" width="7" height="14" fill="#fdba74"/>
<g class="in" style="animation-delay:.1s">
<rect x="80" y="90" width="140" height="140" rx="18" fill="#121214"/>
<rect x="80" y="90" width="140" height="140" rx="18" fill="none" stroke="url(#ring)" stroke-width="2"/>
<text x="150" y="182" fill="url(#mark)" font-size="64" font-weight="300" text-anchor="middle" letter-spacing="-2">MA</text>
</g>
<g class="in" style="animation-delay:.25s">
<text x="258" y="127" fill="url(#shine)" font-size="46" font-weight="700" letter-spacing="-.5">Matías Agüero Ventrice</text>
</g>
<text clip-path="url(#type)" x="260" y="167" fill="#f97316" font-size="19">Head of Product &amp; Operations · Grupo Propital</text>
<g class="in" style="animation-delay:1.00s">
<rect x="260" y="200" width="87" height="34" rx="7" fill="#18181b" fill-opacity=".9" stroke="#2e2e33"/>
<text x="303" y="222" class="mono" fill="#d4d4d8" font-size="13.5" text-anchor="middle">Next.js</text>
</g>
<g class="in" style="animation-delay:1.08s">
<rect x="358.8" y="200" width="70" height="34" rx="7" fill="#18181b" fill-opacity=".9" stroke="#2e2e33"/>
<text x="394" y="222" class="mono" fill="#d4d4d8" font-size="13.5" text-anchor="middle">React</text>
</g>
<g class="in" style="animation-delay:1.16s">
<rect x="440.8" y="200" width="112" height="34" rx="7" fill="#18181b" fill-opacity=".9" stroke="#2e2e33"/>
<text x="497" y="222" class="mono" fill="#d4d4d8" font-size="13.5" text-anchor="middle">TypeScript</text>
</g>
<g class="in" style="animation-delay:1.24s">
<rect x="564.8" y="200" width="95" height="34" rx="7" fill="#18181b" fill-opacity=".9" stroke="#2e2e33"/>
<text x="612" y="222" class="mono" fill="#d4d4d8" font-size="13.5" text-anchor="middle">Supabase</text>
</g>
<g class="in" style="animation-delay:1.32s">
<rect x="672.0" y="200" width="78" height="34" rx="7" fill="#18181b" fill-opacity=".9" stroke="#2e2e33"/>
<text x="711" y="222" class="mono" fill="#d4d4d8" font-size="13.5" text-anchor="middle">Python</text>
</g>
<g class="in" style="animation-delay:1.40s">
<rect x="762.4" y="200" width="112" height="34" rx="7" fill="#2a1206" fill-opacity=".9" stroke="#f97316"/>
<text x="818" y="222" class="mono" fill="#f97316" font-size="13.5" text-anchor="middle">Claude API</text>
</g>
<g class="in" style="animation-delay:1.6s">
<circle cx="266" cy="263" r="3.5" fill="#22c55e"/>
<circle cx="266" cy="263" r="3.5" fill="none" stroke="#22c55e"><animate attributeName="r" from="3.5" to="9" begin="2s" dur="2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" from=".7" to="0" begin="2s" dur="2s" repeatCount="indefinite"/></circle>
<text x="278" y="268" fill="#a1a1aa" font-size="13.5">San Juan, Argentina · Remoto</text>
</g>
</svg>
