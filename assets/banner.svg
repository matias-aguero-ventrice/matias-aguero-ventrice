<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Matías Agüero Ventrice — Head of Product &amp; Operations">
<style>
text{font-family:Inter, 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif;}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;}
.in{opacity:0;animation:up .8s cubic-bezier(.2,.8,.3,1) forwards;}
.dot{animation:float 6s ease-in-out infinite;}
.sq{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite;}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes float{50%{transform:translateY(-10px);opacity:.45;}}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;}.dot,.sq{animation:none;}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b0c"/><stop offset="1" stop-color="#18181b"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f97316" stop-opacity=".16"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-520" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fafafa"/><stop offset=".35" stop-color="#f97316"/><stop offset=".6" stop-color="#fdba74"/><stop offset="1" stop-color="#fafafa"/><animateTransform attributeName="gradientTransform" type="translate" from="160 0" to="1300 0" dur="4.5s" repeatCount="indefinite"/></linearGradient>
<clipPath id="card"><rect width="1280" height="320" rx="16"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="320" fill="url(#bg)"/>
<ellipse cx="180" cy="90" rx="320" ry="220" fill="url(#glow)"/>
<g stroke="#ffffff" stroke-opacity=".05">
<line x1="0" y1="30" x2="1280" y2="-40"/>
<line x1="0" y1="90" x2="1280" y2="20"/>
<line x1="0" y1="150" x2="1280" y2="80"/>
<line x1="0" y1="210" x2="1280" y2="140"/>
<line x1="0" y1="270" x2="1280" y2="200"/>
<line x1="0" y1="330" x2="1280" y2="260"/>
<line x1="0" y1="390" x2="1280" y2="320"/>
</g>
<rect width="6" height="320" fill="#f97316"/>
</g>
<circle class="dot" style="animation-delay:0.0s" cx="1120" cy="70" r="3.2" fill="#f97316" fill-opacity=".85"/>
<circle class="dot" style="animation-delay:1.1s" cx="1180" cy="150" r="2.6" fill="#f97316" fill-opacity=".85"/>
<circle class="dot" style="animation-delay:0.6s" cx="1060" cy="210" r="2.4" fill="#f97316" fill-opacity=".85"/>
<circle class="dot" style="animation-delay:1.7s" cx="1210" cy="250" r="3.4" fill="#f97316" fill-opacity=".85"/>
<circle class="dot" style="animation-delay:2.3s" cx="980" cy="60" r="2.2" fill="#f97316" fill-opacity=".85"/>
<rect class="sq" style="animation-delay:0.0s" x="1153" y="43" width="7" height="7" fill="none" stroke="#f97316" stroke-opacity=".8"/>
<rect class="sq" style="animation-delay:1.3s" x="1084" y="124" width="7" height="7" fill="none" stroke="#f97316" stroke-opacity=".8"/>
<rect class="sq" style="animation-delay:0.7s" x="1010" y="262" width="7" height="7" fill="none" stroke="#f97316" stroke-opacity=".8"/>
<g class="in" style="animation-delay:.1s">
<rect x="80" y="90" width="140" height="140" rx="16" fill="#141416" stroke="#f97316" stroke-width="1.5"/>
<text x="150" y="182" fill="#f97316" font-size="64" font-weight="300" text-anchor="middle" letter-spacing="-2">MA</text>
</g>
<g class="in" style="animation-delay:.25s">
<text x="258" y="127" fill="url(#shine)" font-size="46" font-weight="700" letter-spacing="-.5">Matías Agüero Ventrice</text>
</g>
<g class="in" style="animation-delay:.4s">
<text x="260" y="167" fill="#f97316" font-size="19">Head of Product &amp; Operations · Grupo Propital</text>
</g>
<g class="in" style="animation-delay:0.55s">
<rect x="260" y="205" width="87" height="34" rx="7" fill="#18181b" stroke="#2e2e33" stroke-opacity="1"/>
<text x="303" y="227" class="mono" fill="#d4d4d8" font-size="13.5" text-anchor="middle">Next.js</text>
</g>
<g class="in" style="animation-delay:0.63s">
<rect x="358.8" y="205" width="70" height="34" rx="7" fill="#18181b" stroke="#2e2e33" stroke-opacity="1"/>
<text x="394" y="227" class="mono" fill="#d4d4d8" font-size="13.5" text-anchor="middle">React</text>
</g>
<g class="in" style="animation-delay:0.71s">
<rect x="440.8" y="205" width="112" height="34" rx="7" fill="#18181b" stroke="#2e2e33" stroke-opacity="1"/>
<text x="497" y="227" class="mono" fill="#d4d4d8" font-size="13.5" text-anchor="middle">TypeScript</text>
</g>
<g class="in" style="animation-delay:0.79s">
<rect x="564.8" y="205" width="95" height="34" rx="7" fill="#18181b" stroke="#2e2e33" stroke-opacity="1"/>
<text x="612" y="227" class="mono" fill="#d4d4d8" font-size="13.5" text-anchor="middle">Supabase</text>
</g>
<g class="in" style="animation-delay:0.87s">
<rect x="672.0" y="205" width="78" height="34" rx="7" fill="#18181b" stroke="#2e2e33" stroke-opacity="1"/>
<text x="711" y="227" class="mono" fill="#d4d4d8" font-size="13.5" text-anchor="middle">Python</text>
</g>
<g class="in" style="animation-delay:0.95s">
<rect x="762.4" y="205" width="112" height="34" rx="7" fill="#2a1206" stroke="#f97316" stroke-opacity="0.9"/>
<text x="818" y="227" class="mono" fill="#f97316" font-size="13.5" text-anchor="middle">Claude API</text>
</g>
</svg>
